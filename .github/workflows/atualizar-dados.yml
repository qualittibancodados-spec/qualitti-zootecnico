name: Atualizar dados do painel

on:
  schedule:
    # 09:00 Brasília = 12:00 UTC
    - cron: '0 12 * * *'
    # 11:00 Brasília = 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Rodar a atualização
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/atualizar_dados.py

      - name: Publicar os dados atualizados
        run: |
          git config user.name "qualitti-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet && echo "Nada mudou hoje." || git commit -m "Atualização automática dos dados ($(date -u +%Y-%m-%d))"
          git push
